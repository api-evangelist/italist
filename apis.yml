aid: italist
name: Italist
description: >-
  Italist is a luxury fashion e-commerce marketplace that ships designer apparel,
  shoes, bags, and accessories from Italy directly to shoppers worldwide, offering
  boutique inventory at Italian retail prices with duties and taxes handled at
  checkout. Originally surfaced as a portfolio company of 500 Global and added to the
  API Evangelist network as a stub, italist.com now runs as a Shopify-hosted
  storefront that exposes a modern agent-native commerce surface: a published
  Universal Commerce Protocol (UCP) merchant profile, a Model Context Protocol (MCP)
  shopping endpoint, provider-published agents.md / llms.txt agent instructions, and
  Shopify Customer Account API authentication over OpenID Connect. This profile was
  enriched by the pipeline from live probes of the storefront's public agent surface.
